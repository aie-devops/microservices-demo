info:
  name: Get all orders
  type: http
  seq: 11

http:
  method: GET
  url: "{{orderServiceUrl}}/api/orders"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("includes the order for John", function() {
          const ids = res.body.map(o => o.id);
          expect(ids).to.include(bru.getVar("orderId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
