info:
  name: Get all users
  type: http
  seq: 5

http:
  method: GET
  url: "{{userServiceUrl}}/api/users"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("lists John and Jane", function() {
          const ids = res.body.map(u => u.id);
          expect(ids).to.include(bru.getVar("johnId"));
          expect(ids).to.include(bru.getVar("janeId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
