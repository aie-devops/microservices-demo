info:
  name: Get user by id
  type: http
  seq: 6

http:
  method: GET
  url: "{{userServiceUrl}}/api/users/{{johnId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("returns John", function() {
          expect(res.body.id).to.equal(bru.getVar("johnId"));
          expect(res.body.lastName).to.equal("Doe");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
