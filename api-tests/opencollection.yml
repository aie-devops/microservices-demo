opencollection: 1.0.0

info:
  name: microservices-demo
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: userServiceUrl
      value: http://localhost:8081
    - name: orderServiceUrl
      value: http://localhost:8082
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    presets:
      request:
        type: http
